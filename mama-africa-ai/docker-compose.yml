# Ollama is intentionally NOT containerised — it runs directly on the host during
# development, which is why the backend reaches it via host.docker.internal.
services:

  postgres:
    image: postgres:16-alpine
    container_name: mama-africa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mama_africa_ai}
      POSTGRES_USER: ${DB_USERNAME:-mama}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mama}
    ports:
      # Override DB_PORT if something already listens on 5432 on your machine.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mama} -d ${DB_NAME:-mama_africa_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Used from Phase 2 onwards for knowledge-base embeddings.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mama-africa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build: ./backend
    container_name: mama-africa-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-mama_africa_ai}
      DB_USERNAME: ${DB_USERNAME:-mama}
      DB_PASSWORD: ${DB_PASSWORD:-mama}
      AI_PROVIDER: ${AI_PROVIDER:-OLLAMA}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-gemma3:1b}
      AI_API_KEY: ${AI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-must-be-at-least-32-characters-long}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mamaafrica.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional — the console is a static bundle and can equally go on Firebase Hosting.
  # Start it with: docker compose --profile console up
  admin-console:
    build:
      context: ./admin-console
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: mama-africa-console
    profiles: ["console"]
    depends_on:
      - backend
    ports:
      - "${CONSOLE_PORT:-3000}:80"

volumes:
  postgres-data:
  qdrant-data:
